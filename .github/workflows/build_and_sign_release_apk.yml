name: 'Build Kiwi Reborn APK'

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    # Chromium's build system produces one APK per ABI — a single "universal"
    # APK containing both ABIs is not a supported configuration. So we build
    # the two Android ABIs in parallel jobs instead:
    #   arm64-v8a  -> modern devices (the vast majority)
    #   armeabi-v7a -> legacy 32-bit devices
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            cpu: arm64
          - abi: armeabi-v7a
            cpu: arm

    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          df -h

      # Check out the branch/ref that triggered this run (default: kiwi).
      # This way dispatching the workflow on a feature branch builds THAT
      # branch's patches, not always the base kiwi branch.
      - name: Checkout patches (triggering ref)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          path: kiwi-patches

      - name: Install depot_tools
        run: |
          git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git $HOME/depot_tools
          echo "$HOME/depot_tools" >> $GITHUB_PATH

      - name: Read Chromium version
        id: ver
        run: |
          source kiwi-patches/CHROMIUM_VERSION
          echo "version=${CHROMIUM_MAJOR}.${CHROMIUM_MINOR}.${CHROMIUM_BUILD}.${CHROMIUM_PATCH}" >> $GITHUB_OUTPUT
          echo "major=$CHROMIUM_MAJOR" >> $GITHUB_OUTPUT

      - name: Configure gclient for Android
        run: |
          mkdir chromium && cd chromium
          gclient config --name=src \
            https://chromium.googlesource.com/chromium/src.git \
            --unmanaged
          echo "target_os = ['android']" >> .gclient

      - name: Fetch Chromium at pinned version
        run: |
          cd chromium
          gclient sync \
            --no-history \
            --nohooks \
            --revision=src@${{ steps.ver.outputs.version }} \
            -D

      - name: Apply Kiwi patches
        run: |
          for dir in base chrome components content extensions net remoting services third_party ui; do
            if [ -d "kiwi-patches/$dir" ]; then
              echo "Applying $dir patches..."
              cp -rf kiwi-patches/$dir/* chromium/src/$dir/ 2>/dev/null || true
            fi
          done

      - name: Run gclient hooks
        run: |
          cd chromium
          gclient runhooks

      - name: Install Android build dependencies
        run: |
          cd chromium/src
          sudo ./build/install-build-deps.sh --android --no-prompt

      - name: Generate build files (${{ matrix.abi }})
        run: |
          cd chromium/src
          gn gen out/${{ matrix.cpu }} --args='
            target_os = "android"
            target_cpu = "${{ matrix.cpu }}"
            is_debug = false
            is_component_build = false
            is_official_build = false
            ffmpeg_branding = "Chrome"
            proprietary_codecs = true
            android_channel = "stable"
            chrome_pgo_phase = 0

            # Optional Google API / OAuth keys (for Google Account sync and
            # related Google services). Provide these as GitHub Actions
            # secrets GOOGLE_API_KEY, GOOGLE_DEFAULT_CLIENT_ID and
            # GOOGLE_DEFAULT_CLIENT_SECRET in your own fork; leaving them
            # empty keeps the build fully key-free (sign-in UI stays but
            # sync requires user-provided keys per Google ToS).
            google_api_key = "${{ secrets.GOOGLE_API_KEY }}"
            google_default_client_id = "${{ secrets.GOOGLE_DEFAULT_CLIENT_ID }}"
            google_default_client_secret = "${{ secrets.GOOGLE_DEFAULT_CLIENT_SECRET }}"

            # Additional flags for Chromium 148
            enable_autofill_assistant = false
            enable_reading_list = false
            enable_supervised_users = false
            enable_managed_users = false
            enable_dangling_pointer_detection = false
            enable_offline_pages = false
            enable_vr = false
            enable_arc = false
            enable_cast = false
            enable_nacl = false
            symbol_level = 0
            blink_symbol_level = 0
          '

      - name: Compile APK (${{ matrix.abi }})
        run: |
          cd chromium/src
          autoninja -C out/${{ matrix.cpu }} chrome_public_apk

      - name: Upload APK as artifact (${{ matrix.abi }})
        uses: actions/upload-artifact@v4
        with:
          name: kiwi-reborn-${{ matrix.abi }}
          path: chromium/src/out/${{ matrix.cpu }}/apks/ChromePublic.apk
          retention-days: 14
